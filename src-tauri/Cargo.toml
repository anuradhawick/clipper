[package]
name = "app"
version = "1.4.0"
description = "Clipper"
authors = ["Anuradha Wickramarachchi <anuradhawick@gmail.com>"]
license = "AGPL 3.0"
repository = "https://github.com/anuradhawick/clipper"
default-run = "app"
edition = "2021"
rust-version = "1.93.1"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.2", features = ["macos-private-api", "tray-icon"] }
arboard = "3.6.1"
tokio = { version = "1.53.2", features = ["full"] }
uuid = { version = "1.28.0", features = ["v4"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "tls-none"] }
chrono = "0.4.45"
log = "0.4.34"
tauri-plugin-log = "2.10.0"
image = "0.25.10"
tauri-plugin-opener = "2.7.0"
mouse_position = "0.1.4"
futures = "0.3.34"
url = "2.5.8"
tauri-plugin-os = "2.4.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
scraper = "0.27.0"
anyhow = "1.0.104"
thiserror = "2.0.21"

# macos dependencies
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.0"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enables link-time-optimizations.
opt-level = "s"   # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort"   # Higher performance by disabling panic handlers.
strip = true      # Ensures debug symbols are removed.
